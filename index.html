<!DOCTYPE html>
<html lang="es-MX">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MolecuLab 3D</title>

  <!-- Tipografía de la guía visual: Nunito Sans (títulos) e Inter (texto) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&amp;family=Nunito+Sans:wght@700&amp;display=swap"
    rel="stylesheet">

  <!-- Librerías por CDN con versión fija. Debe ir antes de cualquier script de módulo. -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.183.2/build/three.module.js",
      "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.20/vision_bundle.mjs"
    }
  }
  </script>

  <link rel="stylesheet" href="css/styles.css">
</head>

<body>

  <!-- Interruptor del menú de átomos (sin JavaScript).
       Se activa con clic en la etiqueta «Átomos» o con Tab y Espacio. -->
  <input type="checkbox" id="menu-atomos" class="solo-lector">

  <header class="encabezado">
    <div class="encabezado-izq">
      <label for="menu-atomos" class="boton-menu">
        <span class="hamburguesa" aria-hidden="true"></span>
        <span>Átomos</span>
      </label>
      <h1 class="marca">
        <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
          <circle cx="16" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="2" />
          <circle cx="8" cy="24" r="4" fill="none" stroke="currentColor" stroke-width="2" />
          <circle cx="24" cy="24" r="4" fill="none" stroke="currentColor" stroke-width="2" />
          <path d="M14 11 9 20M18 11l5 9" stroke="currentColor" stroke-width="2" />
        </svg>
        MolecuLab 3D
      </h1>
    </div>
    <span class="chip">Modo libre</span>
  </header>

  <!-- Barra de estado: cámara, mano, micrófono y última acción -->
  <div id="barra-estado" class="barra-estado">
    <div id="estado-camara" class="indicador estado-aviso">
      <span class="punto" aria-hidden="true"></span>
      <div>
        <strong>Cámara</strong>
        <span class="valor">Sin permiso</span>
      </div>
    </div>
    <div id="estado-mano" class="indicador estado-aviso">
      <span class="punto" aria-hidden="true"></span>
      <div>
        <strong>Mano</strong>
        <span class="valor">No detectada</span>
      </div>
    </div>
    <div id="estado-microfono" class="indicador estado-aviso">
      <span class="punto" aria-hidden="true"></span>
      <div>
        <strong>Micrófono</strong>
        <span class="valor" aria-live="polite">Pausado</span>
      </div>
    </div>
    <div id="estado-accion" class="indicador estado-ok">
      <span class="punto" aria-hidden="true"></span>
      <div>
        <strong>Última acción</strong>
        <span class="valor">Ninguna todavía</span>
      </div>
    </div>
  </div>

  <!-- Zona de mensajes: avisos, confirmaciones y errores -->
  <div id="zona-mensajes" class="zona-mensajes" role="status" aria-live="polite">
    <span class="icono" aria-hidden="true">i</span>
    <p>Aquí aparecerán los avisos y las confirmaciones.</p>
    <!-- Ejemplo: <p class="mensaje mensaje-error">Error: el hidrógeno ya completó su valencia.</p> -->
  </div>

  <main class="escena">

    <!-- Panel de átomos: oculto al inicio, se abre con «Átomos» -->
    <aside id="panel-atomos" class="panel panel-atomos">
      <h2>Átomos</h2>
      <div id="lista-elementos" class="lista-elementos"></div>
    </aside>

    <!-- Escena 3D: Three.js crea aquí su propio canvas -->
    <section id="lienzo-3d" class="lienzo" aria-label="Escena 3D de la molécula">

      <!-- Cámara en espejo con la superposición de la mano (abajo a la izquierda, como en el wireframe) -->
      <figure class="camara-flotante">
        <div class="camara">
          <video id="camara-espejo" autoplay playsinline muted></video>
          <canvas id="superposicion-mano"></canvas>
        </div>
        <figcaption>Cámara espejo</figcaption>
      </figure>

    </section>

    <!-- Información de la molécula identificada -->
    <aside id="panel-info" class="panel panel-info" aria-labelledby="titulo-info">
      <h2 id="titulo-info">Molécula</h2>
      <dl>
        <dt>Fórmula</dt>
        <dd data-campo="formula">—</dd>
        <dt>Nombre</dt>
        <dd data-campo="nombre">—</dd>
        <dt>Geometría</dt>
        <dd data-campo="geometria">—</dd>
      </dl>
      <p class="descripcion" data-campo="descripcion">Construye una molécula y verifícala para ver su información aquí.
      </p>
    </aside>

  </main>

  <!-- Acciones de respaldo: funcionan sin cámara ni voz -->
  <footer id="botones-respaldo" class="respaldo">
    <button class="boton tip" data-tip="Deshace la última acción · Voz / Clic" data-accion="deshacer">
      Deshacer
      <span class="solo-lector">Voz o clic</span>
    </button>
    <button class="boton tip" data-tip="Borra la escena, con confirmación · Voz / Clic" data-accion="limpiar">
      Limpiar
      <span class="solo-lector">Voz o clic</span>
    </button>
    <button class="boton boton-principal tip" data-tip="Verifica la molécula · Pulgar arriba (1 seg) / Voz / Clic"
      data-accion="verificar">
      Verificar molécula
      <span class="solo-lector">Pulgar arriba, voz o clic</span>
    </button>
    <button class="boton tip" data-tip="Activa o pausa el micrófono · Tecla Espacio / Clic" data-accion="microfono"
      aria-keyshortcuts="Space">
      Micrófono
      <span class="solo-lector">Tecla Espacio o clic</span>
    </button>
  </footer>

  <script type="module" src="js/main.js"></script>
</body>

</html>
