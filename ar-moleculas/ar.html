<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Moléculas en AR · MolecuLab</title>
    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.4.0/model-viewer.min.js"></script>
    <link rel="stylesheet" href="ar.css">
</head>

<body>
    <header>
        <h1>MolecuLab · AR</h1>
        <label class="solo-lector" for="selector">Elegir molécula</label>
        <select id="selector" aria-label="Elegir molécula">
            <option>Cargando catálogo…</option>
        </select>
    </header>

    <model-viewer id="visor" alt="Molécula" ar camera-controls shadow-intensity="1" touch-action="pan-y"></model-viewer>

    <footer>
        <div id="info"></div>
        <div id="subtitulo"></div>
        <section id="atomos" class="atomos" aria-live="polite"></section>
        <p id="aviso">Toca el botón de AR del visor para colocar la molécula sobre la mesa.
            En Android se abre Scene Viewer con Chrome. En iPhone se abre la vista de AR de Safari.
            Si el botón no aparece, el dispositivo no es compatible con la realidad aumentada.</p>
    </footer>

    <script type="module" src="ar.js"></script>
    <script>
        setTimeout(function () {
            var sel = document.getElementById('selector');
            if (sel && sel.options.length === 1 && sel.options[0].textContent.indexOf('Cargando') === 0) {
                document.getElementById('info').textContent = 'No se cargó ar.js. Revisa que ar.js esté en la misma carpeta que ar.html.';
            }
        }, 8000);
    </script>
</body>

</html>
