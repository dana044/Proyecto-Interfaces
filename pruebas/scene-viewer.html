<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prueba Scene Viewer · MolecuLab</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Inter, system-ui, sans-serif;
      background: #0F1419;
      color: #e5e7eb;
    }

    model-viewer {
      width: 100%;
      height: 80vh;
      background: #0F1419;
    }

    p {
      margin: 12px;
      font-size: 15px;
    }
  </style>
</head>

<body>
  <!-- Mismo GLB en GitHub Pages: "ar" con "scene-viewer" abre la RA de Android (ARCore). -->
  <model-viewer src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" alt="Astronauta" ar
    ar-modes="scene-viewer" camera-controls auto-rotate></model-viewer>
  <p>Toca el botón AR en tu Android (Chrome). Debe pedir permiso de cámara y colocar la molécula sobre la mesa.</p>
</body>

</html>
